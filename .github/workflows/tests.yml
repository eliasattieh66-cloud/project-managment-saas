name: Tests

on:
  push:
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_management_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_management_saas_test
      JWT_SECRET: test-jwt-secret
      RESEND_API_KEY: test-resend-key
      EMAIL_FROM: "TaskFlow <onboarding@resend.dev>"
      CLIENT_URL: http://localhost:5173
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      PGPASSWORD: postgres

    defaults:
      run:
        working-directory: server

    steps:
      - name: Download the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Run database migrations
        run: |
          for file in ../database/migrations/*.sql; do
            echo "Running $file"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d project_management_saas_test -f "$file"
          done

      - name: Run tests
        run: npm test
